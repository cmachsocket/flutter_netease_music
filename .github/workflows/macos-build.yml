name: macOS Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build macOS ARM64 bundle
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      # ------------------------------------------------------------
      # Source
      # ------------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # ------------------------------------------------------------
      # Xcode
      # ------------------------------------------------------------
      # macos-14 = Apple Silicon runner
      # Flutter macOS build requires Xcode / CocoaPods toolchain.
      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version
          xcode-select -p

      # ------------------------------------------------------------
      # Node.js
      # ------------------------------------------------------------
      # ncm_api_enhanced desktop bridge 使用系统 Node.js。
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            **/package-lock.json

      - name: Verify Node.js
        run: |
          node --version
          npm --version

      # ------------------------------------------------------------
      # Cache
      # ------------------------------------------------------------
      - name: Cache Pub
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-macos-flutter-3.47.0-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            pub-macos-flutter-3.47.0-
            pub-

      # ------------------------------------------------------------
      # Flutter
      # ------------------------------------------------------------
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.0
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      # ------------------------------------------------------------
      # Dependencies
      # ------------------------------------------------------------
      - name: Flutter pub get
        run: flutter pub get

      # ------------------------------------------------------------
      # Enable macOS desktop
      # ------------------------------------------------------------
      - name: Enable macOS desktop
        run: |
          flutter config --enable-macos-desktop
          flutter devices

      # ------------------------------------------------------------
      # Build
      # ------------------------------------------------------------
      # macOS ARM64:
      #
      #   build/macos/Build/Products/Release/
      #
      # Flutter 会生成：
      #
      #   flutter_netease_music.app
      #
      # 这里直接将 .app 打包为 tar.gz。
      - name: Build release bundle
        run: |
          flutter build macos \
            --release \
            --no-tree-shake-icons

      # ------------------------------------------------------------
      # Verify
      # ------------------------------------------------------------
      - name: Verify application
        run: |
          APP="build/macos/Build/Products/Release/flutter_netease_music.app"

          if [ ! -d "$APP" ]; then
            echo "::error::Application missing at $APP"
            echo "Actual build output:"
            find build/macos -maxdepth 5 -type d -print 2>/dev/null || true
            exit 1
          fi

          echo "=== Application ==="
          ls -lh "$APP"

          echo
          echo "=== Contents ==="
          find "$APP/Contents" -maxdepth 2 -type f -print | head -100

          echo
          echo "=== Architecture ==="
          file "$APP/Contents/MacOS/flutter_netease_music"

          echo
          echo "=== Dependencies ==="
          otool -L "$APP/Contents/MacOS/flutter_netease_music" || true

      # ------------------------------------------------------------
      # Package
      # ------------------------------------------------------------
      - name: Package artifact
        run: |
          APP="build/macos/Build/Products/Release/flutter_netease_music.app"
          STAGE="release-artifacts/flutter_netease_music-macos-arm64"

          rm -rf release-artifacts
          mkdir -p "$STAGE"

          cp -R "$APP" "$STAGE/"

          cd release-artifacts

          tar -czf flutter_netease_music-macos-arm64.tar.gz \
            flutter_netease_music-macos-arm64

          shasum -a 256 *.tar.gz > SHA256SUMS

          echo
          echo "=== Release artifacts ==="
          ls -lh

          echo
          echo "=== SHA256SUMS ==="
          cat SHA256SUMS

      # ------------------------------------------------------------
      # GitHub Release
      # ------------------------------------------------------------
      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          overwrite_files: true
          files: |
            release-artifacts/*.tar.gz
            release-artifacts/SHA256SUMS

      # ------------------------------------------------------------
      # Manual workflow run
      # ------------------------------------------------------------
      - name: Upload artifacts (manual run only)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: flutter_netease_music-macos-arm64
          path: release-artifacts/
          retention-days: 7