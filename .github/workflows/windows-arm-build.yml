name: Windows ARM64 Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Windows arm64 bundle
    # windows-11-arm 是 GitHub 2024 推出的 ARM64 runner (基于 Windows 11 ARM)。
    # MSVC 工具链在这里是 ARM64 native,flutter 默认 build 出 arm64 二进制。
    runs-on: windows-11-arm
    timeout-minutes: 60

    steps:
      # ------------------------------------------------------------
      # Source
      # ------------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # ------------------------------------------------------------
      # System dependencies
      # ------------------------------------------------------------
      # 同 windows-build.yml (x64): 注释里解释了为什么只装 node。
      # windows-11-arm runner 预装 VS Build Tools + CMake + flutter 需要的
      # 一切 (除了 node)。
      - name: Setup Node.js 22 (matches ncm_api_enhanced upstream)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # ------------------------------------------------------------
      # Cache
      # ------------------------------------------------------------
      # 缓存 key 跟 x64 build 独立 (架构不同,VS intermediate 目录不同)。
      - name: Cache Pub
        uses: actions/cache@v4
        env:
          PUB_CACHE: ${{ runner.workspace }}\.pub-cache
        with:
          path: ${{ runner.workspace }}\.pub-cache
          key: pub-windows-arm-flutter-3.47.0-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            pub-windows-arm-flutter-3.47.0-
            pub-

      # ------------------------------------------------------------
      # Flutter
      # ------------------------------------------------------------
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.0
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      # ------------------------------------------------------------
      # Dependencies
      # ------------------------------------------------------------
      - name: Flutter pub get
        env:
          PUB_CACHE: ${{ runner.workspace }}\.pub-cache
        run: flutter pub get

      # ------------------------------------------------------------
      # Build
      # ------------------------------------------------------------
      # flutter build windows 在 windows-11-arm runner 上默认 build arm64。
      # 输出路径跟 x64 同 (build/windows/<runner arch>/runner/Release/),
      # cmake 内部根据 host arch 自动选 MSVC toolchain。
      - name: Build release bundle
        shell: pwsh
        run: |
          flutter build windows --release

          Write-Host ""
          Write-Host "=== build/windows layout ==="
          if (Test-Path "build/windows") {
            Get-ChildItem -Recurse -Depth 4 build/windows |
              Where-Object { $_.PSIsContainer } |
              ForEach-Object { Write-Host $_.FullName }
          }

      # ------------------------------------------------------------
      # Verify bundle
      # ------------------------------------------------------------
      - name: Verify bundle
        shell: pwsh
        run: |
          # windows-11-arm runner 上 flutter build windows 写到 arch-specific 子目录,
          # 但具体是 'arm64' 还是 'arm' 取决于 flutter 版本 —— 通配匹配。
          $bundle = Get-ChildItem -Recurse -Directory -Path "build\windows" `
            | Where-Object { $_.Name -match '^(x64|arm64|arm)$' } `
            | Select-Object -First 1
          if (-not $bundle) {
            $fallback = "build\windows\arm64\runner\Release"
            if (Test-Path $fallback) { $bundle = Get-Item $fallback }
          }

          if (-not $bundle -or -not (Test-Path $bundle.FullName)) {
            Write-Error "arm64 bundle not found under build/windows"
            Get-ChildItem -Recurse build\windows -ErrorAction SilentlyContinue |
              Where-Object { $_.PSIsContainer } |
              ForEach-Object { Write-Host $_.FullName }
            exit 1
          }

          Write-Host "=== Bundle ==="
          Write-Host $bundle.FullName
          Get-ChildItem -Force $bundle.FullName | Format-Table Name, Length

          $exe = Get-ChildItem -Path $bundle.FullName -Filter "*.exe" `
            -ErrorAction SilentlyContinue
          if (-not $exe) {
            Write-Error "no .exe found in $($bundle.FullName)"
            exit 1
          }
          Write-Host "exe: $($exe.Name)"

          Write-Host ""
          Write-Host "=== exe machine type (should be ARM64) ==="
          # 用 .NET 读 PE 头 Machine 字段: 0xAA64 = IMAGE_FILE_MACHINE_ARM64
          $bytes = [System.IO.File]::ReadAllBytes($exe.FullName)[0..511]
          $peOffset = [System.BitConverter]::ToInt32($bytes, 0x3C)
          $machine = [System.BitConverter]::ToUInt16($bytes, $peOffset + 4)
          Write-Host "Machine: 0x$('{0:X4}' -f $machine) ($machine)"
          if ($machine -ne 0xAA64) {
            Write-Error "exe is not ARM64 (got 0x$('{0:X4}' -f $machine))"
            exit 1
          }
          Write-Host "ARM64 binary verified."

      # ------------------------------------------------------------
      # Package
      # ------------------------------------------------------------
      - name: Package artifact
        shell: pwsh
        run: |
          $bundle = Get-ChildItem -Recurse -Directory -Path "build\windows" `
            | Where-Object { $_.Name -match '^(x64|arm64|arm)$' } `
            | Select-Object -First 1
          if (-not $bundle) {
            $fallback = Get-Item "build\windows\arm64\runner\Release" `
              -ErrorAction SilentlyContinue
            if ($fallback) { $bundle = $fallback }
          }
          if (-not $bundle) {
            Write-Error "bundle directory not found"
            exit 1
          }

          $stage = "release-artifacts\flutter_netease_music-windows-arm64"

          if (Test-Path release-artifacts) {
            Remove-Item release-artifacts -Recurse -Force
          }
          New-Item -ItemType Directory -Path $stage -Force | Out-Null

          Copy-Item -Path (Join-Path $bundle.FullName "*") `
            -Destination $stage -Recurse -Force

          Compress-Archive -Path $stage `
            -DestinationPath "release-artifacts\flutter_netease_music-windows-arm64.zip" `
            -CompressionLevel Optimal -Force

          Get-ChildItem release-artifacts | Format-Table Name, Length

          Write-Host ""
          Write-Host "=== SHA256SUMS ==="
          $sums = @()
          foreach ($f in Get-ChildItem release-artifacts -Filter "*.zip") {
            $h = (Get-FileHash $f -Algorithm SHA256).Hash.ToLower()
            $line = "$h  $($f.Name)"
            $sums += $line
            Write-Host $line
          }
          $sums | Out-File "release-artifacts\SHA256SUMS" -Encoding ascii -NoNewline:$false

      # ------------------------------------------------------------
      # GitHub Release
      # ------------------------------------------------------------
      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          overwrite_files: true
          files: |
            release-artifacts/*.zip
            release-artifacts/SHA256SUMS

      # ------------------------------------------------------------
      # Manual workflow run
      # ------------------------------------------------------------
      - name: Upload artifacts (manual run only)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: flutter_netease_music-windows-arm64
          path: release-artifacts/
          retention-days: 7
