name: Android Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # ------------------------------------------------------------
      # Source
      # ------------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # ------------------------------------------------------------
      # Java / Android SDK
      # ------------------------------------------------------------
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Setup Android SDK
        # v3 + cmdline-tools 11076708 默认跑 `sdkmanager tools`,但该
        # 镜像里 tools 包已被 deprecate,报 `Failed to find package 'tools'`。
        # v4 同样支持 `packages:` 控制,Flutter Android build 不需要老
        # tools 包(platform-tools 自带 adb/aapt/zipalign),把 packages
        # 置空跳过默认安装。cmdline-tools 14742923 (20.0) 是当前推荐。
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '14742923'
          packages: ''

      # ------------------------------------------------------------
      # Cache
      # ------------------------------------------------------------
      - name: Cache Pub
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-ubuntu-flutter-3.47.0-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            pub-ubuntu-flutter-3.47.0-
            pub-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-ubuntu-${{ hashFiles('**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-ubuntu-

      # ------------------------------------------------------------
      # Flutter
      # ------------------------------------------------------------
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.0
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      # ------------------------------------------------------------
      # Android Gradle wrapper
      # ------------------------------------------------------------
      - name: Ensure gradlew is executable
        run: |
          if [ ! -f android/gradlew ]; then
            echo "::error::android/gradlew missing."
            echo "Commit android/gradlew, android/gradlew.bat and"
            echo "android/gradle/wrapper/gradle-wrapper.jar to the app repository."
            exit 1
          fi

          chmod +x android/gradlew

      - name: Write local.properties
        run: |
          mkdir -p android
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      # ------------------------------------------------------------
      # Dependencies
      # ------------------------------------------------------------
      - name: Flutter pub get
        run: flutter pub get

      # ------------------------------------------------------------
      # Build
      # ------------------------------------------------------------
      - name: Build release APK
        run: |
          flutter build apk \
            --release \
            --target-platform=android-arm64 \
            --split-per-abi \
            --no-tree-shake-icons

      # ------------------------------------------------------------
      # Verify APK
      # ------------------------------------------------------------
      - name: Verify APK
        run: |
          APK="build/app/outputs/apk/release/app-arm64-v8a-release.apk"

          if [ ! -f "$APK" ]; then
            echo "::error::APK not found at $APK"
            echo "Actual files:"
            find build/app/outputs/apk/release \
              -maxdepth 2 \
              -type f \
              -print 2>/dev/null || true
            exit 1
          fi

          echo "APK:"
          ls -lh "$APK"

      # ------------------------------------------------------------
      # Verify Native Assets
      # ------------------------------------------------------------
      # ncm_api_enhanced v0.1.0+ 改用 bare-kit (holepunchto/bare-kit v2.4.3)
      # 作为 nodejs-mobile 的 runtime:hook/build.dart 把 node runtime 静态
      # 链接进 libbare-kit.so,所以 APK 里只有 libbare-kit.so,不再有独立的
      # libnode.so 或 libncm_node_bridge.so。libbare-kit.so 通过
      # System.loadLibrary("bare-kit") 在 NcmBareBridge.kt 加载。
      - name: Verify libbare-kit.so in APK
        run: |
          APK="build/app/outputs/apk/release/app-arm64-v8a-release.apk"

          echo "=== Native libraries in APK ==="
          unzip -l "$APK" | grep -E '\.so$' || true

          echo
          echo "=== Checking lib/arm64-v8a/libbare-kit.so ==="

          unzip -l "$APK" \
            | grep -q 'lib/arm64-v8a/libbare-kit\.so' \
            || {
              echo "::error::libbare-kit.so missing from APK"
              exit 1
            }

          echo "libbare-kit.so: OK"

      # ------------------------------------------------------------
      # Verify libbare-kit.so architecture
      # ------------------------------------------------------------
      - name: Verify libbare-kit.so architecture
        run: |
          APK="build/app/outputs/apk/release/app-arm64-v8a-release.apk"

          CHECK_DIR="$RUNNER_TEMP/ncm-native-check"
          mkdir -p "$CHECK_DIR"

          unzip -p "$APK" \
            "lib/arm64-v8a/libbare-kit.so" \
            > "$CHECK_DIR/libbare-kit.so"

          echo "=== libbare-kit.so ==="
          file "$CHECK_DIR/libbare-kit.so"
          readelf -h "$CHECK_DIR/libbare-kit.so" \
            | grep -E 'Class|Machine'

          echo

          if ! readelf -h "$CHECK_DIR/libbare-kit.so" \
              | grep -q 'Machine:.*AArch64'; then
            echo "::error::libbare-kit.so is not AArch64"
            exit 1
          fi

          echo "libbare-kit.so is AArch64."

      # ------------------------------------------------------------
      # Inspect libbare-kit.so dependencies
      # ------------------------------------------------------------
      - name: Inspect libbare-kit.so dependencies
        run: |
          APK="build/app/outputs/apk/release/app-arm64-v8a-release.apk"

          CHECK_DIR="$RUNNER_TEMP/ncm-native-check"
          mkdir -p "$CHECK_DIR"

          unzip -p "$APK" \
            "lib/arm64-v8a/libbare-kit.so" \
            > "$CHECK_DIR/libbare-kit.so"

          echo "=== libbare-kit.so DT_NEEDED ==="
          readelf -d "$CHECK_DIR/libbare-kit.so" | grep NEEDED || true

      # ------------------------------------------------------------
      # Prepare artifacts
      # ------------------------------------------------------------
      - name: Prepare artifacts
        run: |
          APK="build/app/outputs/apk/release/app-arm64-v8a-release.apk"

          mkdir -p release-artifacts

          cp "$APK" release-artifacts/

          cd release-artifacts

          sha256sum *.apk > SHA256SUMS

          echo
          echo "=== release artifacts ==="
          ls -lh

          echo
          echo "=== SHA256SUMS ==="
          cat SHA256SUMS

      # Release 在独立的 .github/workflows/release.yml 里统一处理,
      # 这里只负责 build + verify。release.yml 用 workflow_run 监听
      # 4 个 build 都 success 才发,避免 4 个 runner 并发改同一 release
      # 造成竞态。
      # 把 release-artifacts/ 上传成 GH Actions artifact,给 release.yml 用
      # actions/download-artifact 拉。注意 artifact name 不能带点且要全平台
      # 唯一,这里用 platform 名 + tag 区分。
      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts-android-${{ github.ref_name }}
          path: release-artifacts/
          retention-days: 7
