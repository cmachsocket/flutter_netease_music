# GitHub Actions: Android APK build (含 musiclibrary NDK CMake 构建)
#
# 触发: 打 tag 时 (v*.*.*)
# 产物: 推送到对应 GitHub Release,作为版本化 APK
#
# 用法:
#   git tag v1.2.3
#   git push origin v1.2.3
#   -> Actions 跑 build -> 创建 Release v1.2.3 -> 上传 APK

name: Android Release (musiclibrary NDK)

on:
  push:
    tags:
      - 'v*.*.*'   # 只匹配 v 开头且符合 semver 的 tag (v1.2.3, v0.1.0-beta 等)
  workflow_dispatch: # 也允许手动触发 (手动触发时不创建 release)
    inputs:
      create_release:
        description: '创建 GitHub Release'
        type: boolean
        default: false

permissions:
  contents: write   # 创建 release 需要写权限

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout (含 submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '11076708'
          build-tools-version: '35.0.0'

      - name: Cache Pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool/package_config.json
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Cache NDK & CMake
        uses: actions/cache@v4
        with:
          path: |
            ~/.android/sdk/ndk
            ~/.android/sdk/cmake
          key: ${{ runner.os }}-android-ndk-cmake-${{ hashFiles('**/build.gradle.kts') }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.0

      - name: Verify Flutter
        run: |
          flutter --version
          flutter doctor -v

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK (debug)
        run: |
          cd android
          ./gradlew :app:assembleDebug --stacktrace --warning-mode=summary

      - name: Build APK (release)
        run: |
          cd android
          ./gradlew :app:assembleRelease --stacktrace --warning-mode=summary || \
            echo "⚠️ release build failed (likely missing signing config), skipping release APK"

      - name: Verify .so 在 APK 里
        run: |
          APK=$(find android/app/build/outputs/apk/debug -name "app-debug.apk" | head -1)
          if [ -z "$APK" ]; then
            echo "❌ APK not found!"; exit 1
          fi
          unzip -l "$APK" | grep -E "ncm_music_api|libcurl" || {
            echo "❌ native libs missing from APK"; exit 1; }
          echo "✓ native libs bundled in $APK"

      - name: Prepare release artifacts
        id: prepare
        run: |
          mkdir -p release-artifacts
          # debug APK 必带
          cp android/app/build/outputs/apk/debug/app-debug.apk release-artifacts/
          # release APK (如果有)
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk release-artifacts/
          fi
          # 生成 checksums
          cd release-artifacts
          sha256sum *.apk > SHA256SUMS
          ls -la

      # ============ 自动 Release ============
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }} # 含 - 视为预发布 (v1.0.0-beta)
          generate_release_notes: true
          files: |
            release-artifacts/*.apk
            release-artifacts/SHA256SUMS
          body: |
            ## ${{ github.ref_name }}

            自动构建产物。详见 [workflow run #${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})。

            ### 包含内容
            - `app-debug.apk` — debug 签名 (可直接安装)
            - `app-release.apk` — release 签名 (仅当 signing config 配置时存在)
            - `SHA256SUMS` — 所有 APK 的校验和
          fail_on_unmatched_files: true

      - name: Upload artifacts (workflow_dispatch only)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: app-build
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 7