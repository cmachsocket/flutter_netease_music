---
name: Android Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '11076708'

      - name: Cache Pub
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ hashFiles('**/pubspec.lock') }}

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: gradle-${{ hashFiles('**/gradle-wrapper.properties') }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.0

      # 2026-08-25: 不再现场编译 MusicLibrary 原生库。
      # Android plugin (NeteaseCloudMusic_PythonSDK/src/dart/android) 改为预编译嵌入:
      # jniLibs/<abi>/{libncm_music_api,libkugou_music_api,libengine,libqjs,libcurl}.so
      # 已 commit 进 plugin git (4 ABI × 5 个 = 20 个文件), AGP 默认 jniLibs 自动打包进 APK。
      # 之前需要 webpack + pnpm install + 现场 NDK 编译那 4 个 step 已废弃。
      # 也不再需要 bundle/c/*.c, 也不再需要 ./gradlew assembleDebug 现场编译。

      - name: Ensure gradlew is executable
        run: |
          # Wrapper files (gradlew, gradlew.bat, gradle-wrapper.jar) must be committed
          # to the repo. If this step fails with "No such file", commit them.
          # See: https://docs.gradle.org/current/userguide/gradle_wrapper.html
          if [ ! -f android/gradlew ]; then
            echo "::error::android/gradlew missing — wrapper not committed. Run 'gradle wrapper' locally and commit android/gradlew{,bat} + android/gradle/wrapper/gradle-wrapper.jar."
            exit 1
          fi
          chmod +x android/gradlew

      - name: Write local.properties
        run: |
          mkdir -p android
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Flutter pub get
        run: flutter pub get

      - name: Build debug APK
        # 2026-08-24 优化: 原来 4 ABI 全编 + debug symbol 完整输出 = 178MB。
        # 改成只出 arm64-v8a split APK:
        #   - --target-platform=android-arm64 限制 Flutter Dart AOT engine (libapp.so)
        #     只编 arm64。
        #   - --split-per-abi 让 AGP splits 拆出单 ABI APK。
        # 注: FlutterPlugin 只 hook application module, plugin (library module, 如
        # musiclibrary) 仍按 plugin 自己的 defaultConfig 编全部 ABI .so。但 splits 在
        # 打包阶段只挑目标 ABI 进 APK, 最终 APK 仍是单 ABI。
        # release build 保留 4 ABI: 去掉 --target-platform 保留 --split-per-abi
        # (产 4 个 split APK, 每个含一个 ABI)。
        working-directory: .
        run: |
          flutter build apk \
            --debug \
            --target-platform=android-arm64 \
            --split-per-abi \
            --build-name=1.0.0 \
            --build-number=1 \
            --no-tree-shake-icons

      # 路径说明: AGP splits-per-abi + debug buildType 产出
      #   <repo-root>/build/app/outputs/apk/debug/app-arm64-v8a-debug.apk
      # (命名规则: <module>-<abi>-<buildType>.apk, 见 AGP docs configure-apk-splits)。
      # 之前误写成 app-arm64-v8a.apk, verify step 找不到文件。
      # android/build.gradle.kts 里 rootProject.layout.buildDirectory.dir("../../build")
      # 把 build/ 移到仓库根。
      - name: Verify native libs in APK
        run: |
          APK="build/app/outputs/apk/debug/app-arm64-v8a-debug.apk"
          if [ ! -f "$APK" ]; then
            echo "::error::APK not found at $APK"
            exit 1
          fi
          unzip -l "$APK" | grep -E "ncm_music_api|libcurl" \
            || { echo "::error::native libs missing"; exit 1; }
          echo "native libs OK"

      - name: Prepare artifacts
        id: prep
        run: |
          mkdir -p release-artifacts
          cp build/app/outputs/apk/debug/app-arm64-v8a-debug.apk release-artifacts/
          cd release-artifacts
          sha256sum *.apk > SHA256SUMS

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            release-artifacts/*.apk
            release-artifacts/SHA256SUMS

      - name: Upload artifacts (manual run only)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: app-build
          path: release-artifacts/
          retention-days: 7