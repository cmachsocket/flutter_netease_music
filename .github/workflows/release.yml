name: Release

# 监听 4 个 build workflow 全部完成后再统一发 release。
# 不用 push tag 直接触发,避免 4 个 runner 并发改同一 release 造成竞态。
on:
  workflow_run:
    workflows: ["Android Release", "Windows Release", "Linux Release", "macOS Release"]
    types: [completed]

# 同一 tag 的 release run 串行化,避免 race。
concurrency:
  group: release-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Publish unified GitHub Release
    # 只在本次 workflow_run 触发的 build 是 success 时进 job(其他 build 的
    # 状态在 verify step 里查)。这样把"4 个 build workflow 任一不是 success"
    # 的早 fail 路径下放到 verify step,失败时 cancel-in-progress 会被尊重。
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      # workflow_run 每次某个 build workflow 跑完都触发 release.yml 一次。
      # 在这里用 gh run watch 等齐 4 个 build workflow 的最近一次 push run
      # 都 success 才放行。这样:timeline 上虽然会出现 4 个 release.yml run,
      # 但只有 1 个会跑完 verify step,其他 3 个被 gh run watch 自动 cancel
      # (或 fail),避免重复发 release。
      - name: Wait for all 4 platform builds
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          WORKFLOWS=("android-build.yml" "windows-build.yml" "linux-build.yml" "macos-build.yml")

          # 1) 拿 4 个 build workflow 的最近 push run id
          declare -a run_ids
          for file in "${WORKFLOWS[@]}"; do
            run_id=$(gh api \
              "repos/${{ github.repository }}/actions/workflows/${file}/runs?event=push&per_page=1" \
              --jq '.workflow_runs[0].database_id // empty')

            if [ -z "$run_id" ]; then
              echo "::error::No recent push run for ${file}"
              exit 1
            fi

            run_ids+=("$run_id")
            echo "  ${file}: run ${run_id}"
          done

          # 2) 轮询每个 run 的 status(不等它 running,直接看是否已经 success)
          #    用 gh run watch 阻塞,任意一个非 success 就 fail。
          #    多个 watch 串行等,总时间 ≤ 30min(timeout-minutes)。
          for i in "${!run_ids[@]}"; do
            file="${WORKFLOWS[$i]}"
            run_id="${run_ids[$i]}"

            echo
            echo ">>> Waiting for ${file} run ${run_id} to finish..."

            # --exit-status:non-zero only if run failed/cancelled;
            # --fail:not-needed here, we want to know success vs other.
            # We use --exit-status and treat "success" as the only OK outcome.
            if ! gh run watch "$run_id" --exit-status --interval 30 --timeout 1800; then
              echo "::error::${file} run ${run_id} did not finish successfully"
              # 拉 conclusion 写到日志
              gh run view "$run_id" --json conclusion,name,displayTitle || true
              exit 1
            fi
            echo "✓ ${file}: success"
          done

      - name: Determine current and previous tags
        id: tags
        run: |
          current=$(git tag --sort=-creatordate | head -1)
          if [ -z "$current" ]; then
            echo "::error::No tag found in repo"
            exit 1
          fi

          prev=$(git tag --sort=-creatordate | sed -n '2p')
          if [ -z "$prev" ]; then
            # 第一次 release 时没有 prev tag,用 root commit 做 fallback
            prev=$(git rev-list --max-parents=0 HEAD)
          fi

          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "prev=$prev" >> "$GITHUB_OUTPUT"
          echo "Current tag: $current"
          echo "Previous tag: $prev"

      # 4 个 build workflow 都用 actions/upload-artifact@v4 上传了
      # release-artifacts/,这里统一拉下来重新打包到一个 release 里。
      - name: Download artifacts from all 4 builds
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: release-artifacts-*
          merge-multiple: true
        continue-on-error: true

      - name: Stage release assets
        run: |
          mkdir -p staged-release
          shopt -s nullglob

          if [ -d artifacts ]; then
            for f in artifacts/**/*; do
              [ -f "$f" ] || continue
              cp "$f" staged-release/
            done
          fi

          echo "=== Staged files ==="
          ls -la staged-release/

          # 没有任何文件就 fail,不能发空 release
          if [ -z "$(ls -A staged-release/)" ]; then
            echo "::error::No artifacts to release. Check that build workflows uploaded release-artifacts-*"
            exit 1
          fi

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          current="${{ steps.tags.outputs.current }}"
          prev="${{ steps.tags.outputs.prev }}"

          repo="${{ github.repository }}"

          # compare URL:只对 prev 是真 tag 时写 Full Changelog 行,
          # fallback 到 root commit 时不写(URL 会很奇怪)。
          if [[ "$prev" =~ ^v?[0-9] ]]; then
            notes_suffix="**Full Changelog**: https://github.com/${repo}/compare/${prev}...${current}"
          else
            notes_suffix="Initial release."
          fi

          prerelease_flag=""
          if [[ "$current" == *-* ]]; then
            prerelease_flag="--prerelease"
          fi

          # 如果 release 已存在(比如重跑 release.yml),追加 assets 而不重建,
          # 避免覆盖人工编辑过的 release notes。
          if gh release view "$current" >/dev/null 2>&1; then
            echo "Release $current already exists, uploading assets only."
            gh release upload "$current" staged-release/* --clobber
          else
            gh release create "$current" \
              staged-release/* \
              --title "$current" \
              --notes "$notes_suffix" \
              --generate-notes \
              $prerelease_flag
          fi
