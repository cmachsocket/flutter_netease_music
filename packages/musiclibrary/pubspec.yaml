name: musiclibrary
description: Dart FFI bindings for MusicLibrary - access NetEase Cloud Music and KuGou Music APIs.
homepage: https://github.com/2061360308/MusicLibrary
version: 0.0.1

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.3.0"

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.1.2

topics:
  - music
  - netease
  - kugou
  - api
  - music-library

keywords:
  - music
  - netease
  - kugou
  - api
  - ffi
  - library

license: MIT

# 可选：添加详细 README.md 路径
# documentation: README.md

# 可选：添加分类
category: Multimedia

# 平台支持 - flutter 工具链通过 flutter.plugin.platforms 识别 plugin
# Android: 自带 NDK native build (packages/musiclibrary/android/)
# 其他平台: dart-only,复用预编译的 .so (Linux 用 packages/../linux/native_libraries/)
flutter:
  plugin:
    platforms:
      android:
        ffiPlugin: true
      ios:
        ffiPlugin: true
      linux:
        ffiPlugin: true
      macos:
        ffiPlugin: true
      windows:
        ffiPlugin: true